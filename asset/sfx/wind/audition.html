<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>长风声源 · 试听与裁剪</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1f1f1c;
      --muted: #6f6a60;
      --line: #d8d2c6;
      --card: #fffdf8;
      --accent: #b23a2b;
      --accent-soft: #f0dfd8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    }
    main { width: min(980px, calc(100% - 40px)); margin: 48px auto 72px; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 22px; }
    h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 8px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 22px 0 18px; color: var(--muted); font-size: 14px; }
    input[type="range"] { accent-color: var(--accent); width: 180px; }
    h2 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 210px;
    }
    .card.active { border-color: var(--accent); box-shadow: 0 8px 20px rgba(40,30,20,.07); }
    .no { color: var(--accent); font-size: 12px; letter-spacing: .12em; }
    .name { font-size: 20px; margin: 6px 0 4px; }
    .desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
    .meta { display: flex; justify-content: space-between; color: #8a8377; font-size: 12px; margin-bottom: 12px; }
    .trim { color: var(--accent); font-size: 13px; margin: 0 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    button {
      border: 1px solid var(--line);
      background: #fbf8f1;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: #b9b1a3; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #9d3124; }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; line-height: 1.8; border-top: 1px solid var(--line); padding-top: 16px; }
    footer a { color: var(--accent); text-underline-offset: 3px; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .92em; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>长风声源 · 试听与裁剪</h1>
    <p class="sub">“字符和部分字符段飘入”适合用风声铺底。先点“播放推荐段”，听 4—6 秒的 in/out 点；觉得合适再去长音源里裁。全部 CC0。</p>
  </header>

  <div class="toolbar">
    <label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.42"></label>
    <span id="status">未播放</span>
  </div>

  <h2>长音源 · 6 条</h2>
  <section class="grid" id="longGrid"></section>

  <h2>预裁版 · 4 条</h2>
  <section class="grid" id="cutGrid"></section>

  <footer>
    文件位于 <code>asset/sfx/wind/</code>；推荐裁剪点、来源和授权见 <a href="README.md">README.md</a>，机器可读配置见 <a href="manifest.json">manifest.json</a>。
  </footer>
</main>

<script>
const longSources = [
  { file: 'wind-long-01-slow-air-whoosh.mp3', no: 'L01', name: 'Slow Air Whoosh', desc: '慢速气流，两个自然起伏，噪声感强。', dur: '25.78s', start: 2.0, end: 7.5 },
  { file: 'wind-long-02-airy-whooshes.mp3', no: 'L02', name: 'Airy Whooshes', desc: '多段处理过的 whoosh，颗粒更细。', dur: '9.67s', start: 3.2, end: 7.0 },
  { file: 'wind-long-03-wind-gust.mp3', no: 'L03', name: 'Wind Gust', desc: '真实走廊阵风，起伏明显。', dur: '18.19s', start: 10.5, end: 15.5 },
  { file: 'wind-long-04-soft-wind.mp3', no: 'L04', name: 'Soft Wind', desc: '柔和环境风声，低频更多，适合铺底。', dur: '35.67s', start: 13.5, end: 20.0 },
  { file: 'wind-long-05-formant-wind.mp3', no: 'L05', name: 'Formant Wind', desc: '合成共振风，质感偏电子。', dur: '8.40s', start: 0.0, end: 5.0 },
  { file: 'wind-long-06-long-swoosh.mp3', no: 'L06', name: 'Long Swoosh', desc: '长扫气声，带一点音调。', dur: '11.27s', start: 0.5, end: 4.5 }
];

const readyCuts = [
  { file: 'wind-ready-01-slow-rise.mp3', no: 'R01', name: '慢速气流 · 上升', desc: '最接近“字符飘入”，5.5s。', dur: '5.50s' },
  { file: 'wind-ready-02-gust.mp3', no: 'R02', name: '阵风 · 强调', desc: '转折/压轴，5.0s。', dur: '5.00s' },
  { file: 'wind-ready-03-swoosh.mp3', no: 'R03', name: '扫气 · 转场', desc: '整块文字/页面切换，4.0s。', dur: '4.00s' },
  { file: 'wind-ready-04-breath.mp3', no: 'R04', name: '细气 · 轻飘', desc: '短句/频繁出现，3.8s。', dur: '3.80s' }
];

const volume = document.getElementById('volume');
const status = document.getElementById('status');
let activeAudio = null;
let stopTimer = null;
let activeCard = null;

function setActive(card) {
  if (activeCard) activeCard.classList.remove('active');
  activeCard = card;
  if (card) card.classList.add('active');
}

function stopActive() {
  if (activeAudio) {
    activeAudio.pause();
    activeAudio = null;
  }
  clearTimeout(stopTimer);
  setActive(null);
}

function play(file, start, end, label) {
  stopActive();
  const audio = new Audio();
  activeAudio = audio;
  audio.volume = Number(volume.value);
  audio.preload = 'auto';

  audio.addEventListener('loadedmetadata', () => {
    try { audio.currentTime = start; } catch (e) {}
    audio.play().then(() => {
      status.textContent = `正在播放：${label}`;
      if (end != null) {
        const ms = Math.max(0, (end - start) * 1000);
        stopTimer = setTimeout(() => {
          audio.pause();
          status.textContent = `已停在推荐段末尾：${label}`;
          setActive(null);
        }, ms);
      }
    }).catch(() => {
      status.textContent = `播放失败：${label}`;
    });
  }, { once: true });

  audio.addEventListener('ended', () => {
    status.textContent = `播放结束：${label}`;
    setActive(null);
  }, { once: true });

  audio.src = file;
  audio.load();
}

function makeCard(item, isLong) {
  const card = document.createElement('article');
  card.className = 'card';
  const trim = isLong ? `${item.start.toFixed(1)}—${item.end.toFixed(1)}s` : '';
  card.innerHTML = `
    <span class="no">${item.no}</span>
    <div class="name">${item.name}</div>
    <p class="desc">${item.desc}</p>
    <div class="meta"><span>${item.file}</span><span>${item.dur}</span></div>
    ${isLong ? `<div class="trim">推荐段：${trim}</div>` : ''}
    <div class="actions"></div>
  `;
  const actions = card.querySelector('.actions');

  if (isLong) {
    const full = document.createElement('button');
    full.textContent = '播放全段';
    full.addEventListener('click', () => {
      setActive(card);
      play(item.file, 0, null, `${item.name} 全段`);
    });

    const cut = document.createElement('button');
    cut.className = 'primary';
    cut.textContent = `播放推荐段 ${trim}`;
    cut.addEventListener('click', () => {
      setActive(card);
      play(item.file, item.start, item.end, `${item.name} ${trim}`);
    });

    actions.append(full, cut);
  } else {
    const playBtn = document.createElement('button');
    playBtn.className = 'primary';
    playBtn.textContent = '播放';
    playBtn.addEventListener('click', () => {
      setActive(card);
      play(item.file, 0, null, item.name);
    });
    actions.append(playBtn);
  }

  return card;
}

const longGrid = document.getElementById('longGrid');
const cutGrid = document.getElementById('cutGrid');
for (const item of longSources) longGrid.appendChild(makeCard(item, true));
for (const item of readyCuts) cutGrid.appendChild(makeCard(item, false));
</script>
</body>
</html>
