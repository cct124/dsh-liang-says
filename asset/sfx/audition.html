<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梁选文案 · 音效试听</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1f1f1c;
      --muted: #6f6a60;
      --line: #d8d2c6;
      --card: #fffdf8;
      --accent: #b23a2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    }
    main {
      width: min(900px, calc(100% - 40px));
      margin: 48px auto 72px;
    }
    header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
    h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 8px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0; }
    .sub a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
      margin: 22px 0 18px; color: var(--muted); font-size: 14px;
    }
    input[type="range"] { accent-color: var(--accent); width: 180px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    button.sound {
      appearance: none;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 16px 16px 14px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      font: inherit;
      color: inherit;
    }
    button.sound:hover { transform: translateY(-2px); border-color: #b9b1a3; box-shadow: 0 8px 20px rgba(40,30,20,.07); }
    button.sound:active { transform: translateY(0); }
    button.sound.playing { border-color: var(--accent); }
    .no { color: var(--accent); font-size: 12px; letter-spacing: .12em; }
    .name { display: block; font-size: 20px; margin: 6px 0 4px; }
    .mood { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .meta { display: flex; justify-content: space-between; margin-top: 14px; color: #8a8377; font-size: 12px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.8; border-top: 1px solid var(--line); padding-top: 16px; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .92em; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>梁选文案 · 音效试听</h1>
    <p class="sub">点卡片试听。全部为 Freesound CC0 音效，已统一裁剪与响度处理。建议先听 <code>01</code>、<code>04</code>、<code>06</code> 三款，确定整体气质后再选变体。<br>更贴合“字符飘入”的长风声源，见 <a href="wind/audition.html">长风声源试听</a>。</p>
  </header>

  <div class="toolbar">
    <label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.45"></label>
    <span id="now">未播放</span>
  </div>

  <section class="grid" id="grid"></section>

  <footer>
    文件位于 <code>asset/sfx/</code>；来源与许可见 <code>README.md</code> 和 <code>manifest.json</code>。
    浏览器要求先点击页面才能播放，本页的试听按钮本身就是用户交互，不会触发自动播放拦截。
  </footer>
</main>

<script>
const sounds = [
  { file: '01-ding-bell.mp3',       no: '01', name: '清脆铃声', mood: '“叮~” / 短信提示', use: '默认弹窗、轻提示', dur: '0.66s' },
  { file: '02-message-tone.mp3',    no: '02', name: '经典短信音', mood: '“叮咚” / 日常', use: '轻松、日常文案', dur: '1.18s' },
  { file: '03-ui-pop.mp3',          no: '03', name: '轻气泡', mood: '“啵” / 克制', use: '快速出现、极简', dur: '0.36s' },
  { file: '04-deep-dun.mp3',        no: '04', name: '深鼓单响', mood: '“噔” / 重要', use: '重要文案、严肃', dur: '0.72s' },
  { file: '05-deep-dun-dun.mp3',    no: '05', name: '深鼓双响', mood: '“噔噔~” / 强调', use: '转折、压轴', dur: '0.95s' },
  { file: '06-cinematic-riser.mp3', no: '06', name: '电影上升音', mood: '“eng~~” / 揭示', use: '长文案、渐入', dur: '2.12s' },
  { file: '06-cinematic-riser-full.mp3', no: '06f', name: '电影上升音（完整版）', mood: '“eng~~” / 未裁剪', use: '自行选 in/out', dur: '3.00s' },
  { file: '07-deep-swell.mp3',      no: '07', name: '深低频涌起', mood: '“eng——” / 深邃', use: '宏大叙事、世界观', dur: '4.50s' },
  { file: '08-confirm-ping.mp3',    no: '08', name: '确认提示', mood: '“叮~” 上扬 / 确认', use: '选中、收藏、确认', dur: '1.36s' }
];

const grid = document.getElementById('grid');
const volume = document.getElementById('volume');
const now = document.getElementById('now');
let current = null;

// 预加载，点击时更跟手
for (const sound of sounds) {
  const preload = new Audio();
  preload.preload = 'auto';
  preload.src = sound.file;
}

for (const sound of sounds) {
  const button = document.createElement('button');
  button.className = 'sound';
  button.type = 'button';
  button.innerHTML = `
    <span class="no">${sound.no}</span>
    <span class="name">${sound.name}</span>
    <span class="mood">${sound.mood}<br>${sound.use}</span>
    <span class="meta"><span>${sound.file}</span><span>${sound.dur}</span></span>
  `;
  button.addEventListener('click', () => {
    if (current) current.classList.remove('playing');
    button.classList.add('playing');
    current = button;
    now.textContent = `正在播放：${sound.no} ${sound.name}`;

    const audio = new Audio(sound.file);
    audio.volume = Number(volume.value);
    audio.play().then(() => {
      audio.addEventListener('ended', () => {
        button.classList.remove('playing');
        now.textContent = '未播放';
      }, { once: true });
    }).catch(() => {
      now.textContent = '播放失败：请检查文件路径或浏览器权限';
    });
  });
  grid.appendChild(button);
}
</script>
</body>
</html>
