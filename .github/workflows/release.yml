name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - id: metadata
        run: npm run release:metadata -- --tag "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ steps.metadata.outputs.filename }}
            dist/SHA256SUMS
            dist/release-info.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      # These scripts use Node built-ins only. Do not rebuild the reviewed archive.
      - name: Publish the verified archive to npm using OIDC
        run: npm run release:npm
      - name: Publish GitHub Release with the same archive
        run: npm run release:github
        env:
          GH_TOKEN: ${{ github.token }}
